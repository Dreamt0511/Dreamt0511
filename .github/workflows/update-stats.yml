name: Update Stats Cards

# 每天生成统计卡 SVG 提交到仓库，README 通过 jsDelivr 引用（国内外都稳定）
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=Dreamt0511&show_icons=true&hide_border=true&count_private=true&include_all_commits=true&title_color=0b3d91&text_color=1f2937&icon_color=2563eb&bg_color=00000000"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=Dreamt0511&layout=compact&hide_border=true&langs_count=8&title_color=0b3d91&text_color=1f2937&bg_color=00000000"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/ || true
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "chore: update stats cards"; git push; fi

      # 把 README 里的统计卡地址锁定到刚提交的 SHA（同 space-shooter 的理由）
      - name: Pin README stats cards to new commit
        run: |
          SHA=$(git rev-parse HEAD)
          echo "pinning to $SHA"
          sed -i -E "s#(Dreamt0511/Dreamt0511@)[^/]+(/profile/stats\.svg)#\1${SHA}\2#" README.md
          sed -i -E "s#(Dreamt0511/Dreamt0511@)[^/]+(/profile/top-langs\.svg)#\1${SHA}\2#" README.md
          git diff --stat
          if git diff --quiet README.md; then
            echo "README 无需更新"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: pin stats cards to ${SHA:0:7}"
          git pull --rebase origin main || true
          git push || echo "push skipped"
