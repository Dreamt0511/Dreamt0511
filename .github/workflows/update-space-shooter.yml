name: Update Space Shooter

# 把 GitHub 贡献图变成太空射击游戏动画，每天自动更新
on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 0 点
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2    # 必须，用于 amend 合并提交

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: "assets/space-shooter.gif"
          strategy: "random"
          fps: "30"
