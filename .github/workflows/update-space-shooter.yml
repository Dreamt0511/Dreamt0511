name: Update Space Shooter

# 把 GitHub 贡献图变成太空射击游戏动画，每天自动更新
on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 0 点
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2    # 必须，用于 amend 合并提交

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: "assets/space-shooter.gif"
          strategy: "random"
          fps: "30"

      # 把 README 里的 GIF 地址锁定到刚提交的 SHA
      # jsDelivr 对 @main 分支的缓存不可靠，但对具体 SHA 是永久正确的，这样保证显示的一定是最新动画
      - name: Pin README image to new commit
        run: |
          SHA=$(git rev-parse HEAD)          # gh-space-shooter 刚提交的 GIF 所在提交
          echo "pinning to $SHA"
          sed -i -E "s#(Dreamt0511/Dreamt0511@)[^/]+(/assets/space-shooter\.gif)#\1${SHA}\2#" README.md
          git diff --stat
          if git diff --quiet README.md; then
            echo "README 无需更新"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: pin space-shooter image to ${SHA:0:7}"
          git pull --rebase origin main || true
          git push || echo "push skipped"
