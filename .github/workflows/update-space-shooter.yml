name: Update Space Shooter

# 把 GitHub 贡献图变成太空射击游戏动画，每天自动更新
on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 0 点
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2    # 必须，用于 amend 合并提交

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: "assets/space-shooter.gif"
          strategy: "random"
          fps: "30"

      # 更新 README 里图片的版本号，强制所有 CDN/浏览器重新拉取（真正的防缓存）
      - name: Bump image version in README
        run: |
          V=$(date -u +%Y%m%d%H%M)
          sed -i -E "s|(space-shooter\.gif\?v=)[0-9]+|\1${V}|" README.md
          if git diff --quiet README.md; then
            echo "版本号无变化"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: bump space-shooter cache version"
            git pull --rebase origin main || true
            git push || echo "push skipped"
          fi
          curl -sf "https://purge.jsdelivr.net/gh/Dreamt0511/Dreamt0511@main/assets/space-shooter.gif" > /dev/null || true
